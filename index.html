<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO LIMITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #040b16;
            --card-bg: #0a1930;
            --primary-blue: #00b4d8;
            --dark-blue: #003566;
            --text-main: #ffffff;
            --text-muted: #90e0ef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1000px; /* For 3D effect */
        }

        /* --- Card Container with Load Animation --- */
        .card {
            width: 900px;
            height: 600px;
            background: linear-gradient(135deg, var(--card-bg) 0%, #061224 100%);
            border-radius: 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 180, 216, 0.15);
            border: 1px solid rgba(0, 180, 216, 0.2);
            overflow: hidden;
            transform-style: preserve-3d;
            animation: cardAppear 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(50px) scale(0.95);
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- Navbar --- */
        .navbar {
            position: absolute;
            top: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 10;
            animation: fadeIn 1s 0.5s forwards;
            opacity: 0;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .logo:hover {
            background: var(--primary-blue);
            color: var(--card-bg);
            box-shadow: 0 0 15px var(--primary-blue);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links li {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links li::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-blue);
            transition: width 0.3s ease;
            box-shadow: 0 0 8px var(--primary-blue);
        }

        .nav-links li:hover {
            color: var(--text-main);
        }

        .nav-links li:hover::after {
            width: 100%;
        }

        /* --- Background Text --- */
        .bg-text {
            position: absolute;
            top: -10px;
            right: -20px;
            font-size: 140px;
            font-weight: 900;
            color: var(--primary-blue);
            opacity: 0.05;
            letter-spacing: -5px;
            z-index: 1;
            pointer-events: none;
            white-space: nowrap;
            transition: transform 0.2s ease-out; /* For parallax */
        }

        /* --- Left Content --- */
        .content-left {
            position: absolute;
            top: 220px;
            left: 60px;
            z-index: 10;
        }

        .content-left > * {
            animation: slideRight 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        .title {
            font-size: 55px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -2px;
            line-height: 1;
            animation-delay: 0.3s;
            text-shadow: 0 0 20px rgba(0, 180, 216, 0.5);
        }

        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-top: 10px;
            animation-delay: 0.4s;
        }

        .divider {
            width: 6px;
            height: 6px;
            background-color: var(--primary-blue);
            border-radius: 50%;
            margin-top: 50px;
            animation-delay: 0.5s;
            box-shadow: 0 0 10px var(--primary-blue);
        }

        .info-section {
            margin-top: 50px;
            animation-delay: 0.6s;
        }

        .info-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .info-desc {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.6;
            width: 250px;
        }

        .scroll-indicator {
            position: absolute;
            bottom: -120px;
            left: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            animation-delay: 0.7s;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .scroll-indicator:hover {
            color: var(--primary-blue);
        }

        .scroll-icon {
            width: 14px;
            height: 20px;
            border: 1.5px solid currentColor;
            border-radius: 7px;
            position: relative;
        }

        .scroll-icon::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 4px;
            background-color: currentColor;
            border-radius: 1px;
            animation: scrollDown 1.5s infinite;
        }

        /* --- Center Image --- */
        .joker-image {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 75%;
            z-index: 5;
            filter: grayscale(100%) sepia(100%) hue-rotate(190deg) saturate(300%) contrast(1.1) brightness(0.8);
            pointer-events: none;
            animation: imageAppear 1.5s ease-out forwards;
            transition: transform 0.1s ease-out; /* For parallax */
            mix-blend-mode: luminosity;
        }

        /* --- Floating Tags --- */
        .tag {
            position: absolute;
            background: rgba(10, 25, 48, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--primary-blue);
            border: 1px solid rgba(0, 180, 216, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 15;
            animation: float 4s ease-in-out infinite;
            transition: all 0.3s ease;
            cursor: default;
        }

        .tag:hover {
            background: rgba(0, 180, 216, 0.1);
            border-color: var(--primary-blue);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
            transform: scale(1.05);
        }

        .tag-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-blue);
        }

        .tag-intelligence {
            top: 200px;
            right: 180px;
            animation-delay: 1s;
        }

        .tag-unpredictability {
            bottom: 220px;
            right: 150px;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            animation-delay: 1.5s;
        }

        .tag-unpredictability span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Pagination --- */
        .pagination {
            position: absolute;
            top: 50%;
            right: 60px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            animation: fadeIn 1s 1s forwards;
            opacity: 0;
        }

        .pag-num {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #1e3a5f;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .dot:hover {
            background-color: var(--primary-blue);
            transform: scale(1.5);
        }

        .dot.active {
            width: 14px;
            height: 14px;
            background-color: transparent;
            border: 2px solid var(--primary-blue);
            position: relative;
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        }

        .dot.active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: var(--primary-blue);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--primary-blue);
        }

        /* --- Bottom Right Icon --- */
        .bottom-icon {
            position: absolute;
            bottom: 40px;
            right: 60px;
            width: 45px;
            height: 45px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 3s infinite alternate;
        }

        .bottom-icon:hover {
            transform: scale(1.2) rotate(10deg);
            filter: drop-shadow(0 0 10px var(--primary-blue));
        }

        /* --- Keyframes --- */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes imageAppear {
            from { opacity: 0; transform: translateX(-50%) translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes scrollDown {
            0% { transform: translate(-50%, 0); opacity: 1; }
            100% { transform: translate(-50%, 8px); opacity: 0; }
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 0px var(--primary-blue)); }
            100% { filter: drop-shadow(0 0 15px var(--primary-blue)); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- Background Text -->
        <div class="bg-text" id="bgText">NO LIMITE</div>

        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">NL</div>
            <ul class="nav-links">
                <li>Home</li>
                <li>Movie</li>
                <li>About</li>
                <li>Blog</li>
            </ul>
        </nav>

        <!-- Left Content -->
        <div class="content-left">
            <div class="title">NO LIMITE</div>
            <div class="subtitle">Published By NL</div>
            <div class="divider"></div>
            
            <div class="info-section">
                <div class="info-title">Power</div>
                <div class="info-desc">
                    Complete Unpredictability, Chaos Agent, Customized Weapons, Wields Toxin Which Causes Victims To Die Laughing
                </div>
            </div>

            <div class="scroll-indicator">
                <div class="scroll-icon"></div>
                <span>Scroll Mouse</span>
            </div>
        </div>

        <!-- Center Image -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Joaquin_Phoenix_as_Joker_%282019%29.png/800px-Joaquin_Phoenix_as_Joker_%282019%29.png" alt="NO LIMITE" class="joker-image" id="mainImage">

        <!-- Floating Tags -->
        <div class="tag tag-intelligence">
            <div class="tag-dot"></div>
            Intelligence
        </div>

        <div class="tag tag-unpredictability">
            <span><div class="tag-dot"></div> Complete</span>
            <span style="margin-left: 15px;">Unpredictability</span>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <div class="pag-num">01</div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="pag-num">05</div>
        </div>

        <!-- Bottom Right Icon -->
        <svg class="bottom-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 40 Q30 20 50 20 Q70 20 80 40 Q50 60 20 40Z" stroke="#00b4d8" stroke-width="4" fill="#0a1930"/>
            <circle cx="35" cy="35" r="4" fill="#00b4d8"/>
            <circle cx="65" cy="35" r="4" fill="#00b4d8"/>
            <path d="M30 50 Q50 70 70 50" stroke="#00b4d8" stroke-width="4" fill="none"/>
            <path d="M40 55 L45 65 M60 55 L55 65" stroke="#00b4d8" stroke-width="2"/>
        </svg>
    </div>

    <script>
        // 1. Pagination Click Effect
        document.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 2. Parallax Effect (Mouse Move)
        const card = document.getElementById('mainCard');
        const image = document.getElementById('mainImage');
        const bgText = document.getElementById('bgText');

        card.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;

            // تحريك الصورة بشكل معاكس للماوس
            image.style.transform = `translateX(calc(-50% + ${xAxis}px)) translateY(${yAxis}px) scale(1.05)`;
            
            // تحريك النص الخلفي
            bgText.style.transform = `translateX(${xAxis * 1.5}px) translateY(${yAxis * 1.5}px)`;
        });

        // إرجاع العناصر لمكانها عند خروج الماوس
        card.addEventListener('mouseleave', () => {
            image.style.transform = `translateX(-50%) translateY(0px) scale(1)`;
            bgText.style.transform = `translateX(0px) translateY(0px)`;
        });
    </script>
</body>
</html>
