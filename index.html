<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO LIMITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #e6f0fa; /* خلفية زرقاء فاتحة جداً */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            width: 900px;
            height: 600px;
            background-color: #ffffff;
            border-radius: 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 80, 160, 0.1);
            overflow: hidden;
        }

        /* --- Navbar --- */
        .navbar {
            position: absolute;
            top: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 10;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #0056b3;
            color: #0056b3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: -1px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links li {
            font-size: 12px;
            font-weight: 600;
            color: #003366;
            cursor: pointer;
        }

        /* --- Background Text --- */
        .bg-text {
            position: absolute;
            top: -10px;
            right: -20px;
            font-size: 140px;
            font-weight: 900;
            color: #007bff;
            opacity: 0.05;
            letter-spacing: -5px;
            z-index: 1;
            pointer-events: none;
            white-space: nowrap;
        }

        /* --- Left Content --- */
        .content-left {
            position: absolute;
            top: 220px;
            left: 60px;
            z-index: 10;
        }

        .title {
            font-size: 55px;
            font-weight: 900;
            color: #003366;
            letter-spacing: -2px;
            line-height: 1;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #6c8ebf;
            margin-top: 10px;
        }

        .divider {
            width: 4px;
            height: 4px;
            background-color: #6c8ebf;
            border-radius: 50%;
            margin-top: 50px;
        }

        .info-section {
            margin-top: 50px;
        }

        .info-title {
            font-size: 14px;
            font-weight: 700;
            color: #003366;
            margin-bottom: 10px;
        }

        .info-desc {
            font-size: 10px;
            font-weight: 600;
            color: #4a6a8a;
            line-height: 1.6;
            width: 250px;
        }

        .scroll-indicator {
            position: absolute;
            bottom: -120px;
            left: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            font-weight: 600;
            color: #4a6a8a;
        }

        .scroll-icon {
            width: 14px;
            height: 20px;
            border: 1.5px solid #4a6a8a;
            border-radius: 7px;
            position: relative;
        }

        .scroll-icon::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 4px;
            background-color: #4a6a8a;
            border-radius: 1px;
        }

        /* --- Center Image --- */
        .joker-image {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 75%;
            z-index: 5;
            /* فلتر يعطي الصورة لمسة زرقاء */
            filter: grayscale(100%) sepia(30%) hue-rotate(190deg) saturate(300%) contrast(1.1);
            pointer-events: none;
        }

        /* --- Floating Tags --- */
        .tag {
            position: absolute;
            background-color: rgba(240, 248, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            font-weight: 700;
            color: #003366;
            box-shadow: 0 10px 20px rgba(0, 86, 179, 0.1);
            z-index: 15;
        }

        .tag-dot {
            width: 5px;
            height: 5px;
            background-color: #007bff;
            border-radius: 50%;
        }

        .tag-intelligence {
            top: 200px;
            right: 180px;
        }

        .tag-unpredictability {
            bottom: 220px;
            right: 150px;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        .tag-unpredictability span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Pagination --- */
        .pagination {
            position: absolute;
            top: 50%;
            right: 60px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .pag-num {
            font-size: 10px;
            font-weight: 700;
            color: #6c8ebf;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #b3d4f0;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            width: 12px;
            height: 12px;
            background-color: transparent;
            border: 2px solid #007bff;
            position: relative;
        }

        .dot.active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: #007bff;
            border-radius: 50%;
        }

        /* --- Bottom Right Icon --- */
        .bottom-icon {
            position: absolute;
            bottom: 40px;
            right: 60px;
            width: 40px;
            height: 40px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Background Text -->
        <div class="bg-text">NO LIMITE</div>

        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">NL</div>
            <ul class="nav-links">
                <li>Home</li>
                <li>Movie</li>
                <li>About</li>
                <li>Blog</li>
            </ul>
        </nav>

        <!-- Left Content -->
        <div class="content-left">
            <div class="title">NO LIMITE</div>
            <div class="subtitle">Published By NL</div>
            <div class="divider"></div>
            
            <div class="info-section">
                <div class="info-title">Power</div>
                <div class="info-desc">
                    Complete Unpredictability, Chaos Agent, Customized Weapons, Wields Toxin Which Causes Victims To Die Laughing
                </div>
            </div>

            <div class="scroll-indicator">
                <div class="scroll-icon"></div>
                <span>Scroll Mouse</span>
            </div>
        </div>

        <!-- Center Image -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Joaquin_Phoenix_as_Joker_%282019%29.png/800px-Joaquin_Phoenix_as_Joker_%282019%29.png" alt="NO LIMITE" class="joker-image">

        <!-- Floating Tags -->
        <div class="tag tag-intelligence">
            <div class="tag-dot"></div>
            Intelligence
        </div>

        <div class="tag tag-unpredictability">
            <span><div class="tag-dot"></div> Complete</span>
            <span style="margin-left: 15px;">Unpredictability</span>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <div class="pag-num">01</div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="pag-num">05</div>
        </div>

        <!-- Bottom Right Icon -->
        <svg class="bottom-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 40 Q30 20 50 20 Q70 20 80 40 Q50 60 20 40Z" stroke="#003366" stroke-width="4" fill="#e6f0fa"/>
            <circle cx="35" cy="35" r="4" fill="#003366"/>
            <circle cx="65" cy="35" r="4" fill="#003366"/>
            <path d="M30 50 Q50 70 70 50" stroke="#003366" stroke-width="4" fill="none"/>
            <path d="M40 55 L45 65 M60 55 L55 65" stroke="#003366" stroke-width="2"/>
        </svg>
    </div>

    <script>
        document.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
